name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The suite is self-contained: repositories are pool-mocked and every
      # spec sets the JWT secret it needs (docs/TESTS.md). No database here.
      - name: Test
        run: npm test -- --ci
